#cloud-config
package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - netcat
  - unzip

write_files:
  - path: /etc/modules-load.d/containerd.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1

runcmd:
  # 1. Cargar módulos de Kernel y aplicar sysctl
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # 2. Configurar llaves GPG y repositorios
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list

  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - chmod a+r /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /" | tee /etc/apt/sources.list.d/kubernetes.list

  - apt-get update

  # 3. Instalar containerd y componentes de Kubernetes
  - apt-get install -y containerd.io kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl

  # 4. Configurar e iniciar containerd
  - mkdir -p /etc/containerd
  - containerd config default | tee /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # 5. Instalar AWS CLI v2
  - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install

  # 6. Esperar a que el Control Plane publique la orden de join en SSM Parameter Store y ejecutarla
  - |
    TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
    REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)

    echo "Esperando que la orden de kubeadm join esté disponible en SSM Parameter Store..."
    until JOIN_CMD=$(aws ssm get-parameter --name "/k8s/kubeadm/join-command" --with-decryption --query "Parameter.Value" --output text --region $REGION 2>/dev/null); do
      echo "Control Plane aún no ha publicado el token. Reintentando en 10 segundos..."
      sleep 10
    done

    echo "Orden de join recibida. Uniendo worker al clúster..."
    eval "$JOIN_CMD"

final_message: "Worker node setup completed. Joined cluster successfully!"