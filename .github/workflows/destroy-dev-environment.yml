name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to destroy'
        required: true
        type: choice
        options:
          - dev

permissions:
  id-token: write          # Required for OIDC authentication
  contents: read          # Required for repository checkout
  actions: write          # Required for workflow summaries and artifacts

env:
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.7
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}

  # Application secrets (from repository secrets)
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 600  # 10 hours max
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false
          
      - name: Validate Input
        run: |
          # Validate environment
          if [ "${{ env.ENVIRONMENT }}" != "dev" ]; then
            echo "::error::Only 'dev' environment is supported"
            exit 1
          fi
          
      - name: Terraform Init
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
          
      - name: Create Dummy Kubeconfig for Provider Refresh
        run: |
          mkdir -p ~/.kube
          cat <<EOF > ~/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: dummy-cluster
          contexts:
          - context:
              cluster: dummy-cluster
              user: dummy-user
            name: dummy-context
          current-context: dummy-context
          users:
          - name: dummy-user
            user:
              token: dummy-token
          EOF
          chmod 600 ~/.kube/config

      - name: Force Terminate EC2 Instances & Clean VPC Resources
        run: |
          echo "Buscando VPC del entorno '${{ env.ENVIRONMENT }}'..."
          
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=*${{ env.ENVIRONMENT }}*" \
            --query "Vpcs[0].VpcId" --output text)

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "VPC identificada: $VPC_ID"

            # 1. Obtener todas las instancias EC2 en la VPC (excluyendo las ya terminadas)
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query "Reservations[*].Instances[*].InstanceId" --output text)

            if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
              echo "Terminando las siguientes instancias EC2: $INSTANCE_IDS"
              aws ec2 terminate-instances --instance-ids $INSTANCE_IDS

              echo "Esperando a que las instancias se destruyan por completo (estado terminated)..."
              aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
              echo "Instancias eliminadas exitosamente."
            else
              echo "No hay instancias EC2 activas en la VPC."
            fi

            # 2. Ahora que las EC2 murieron, eliminar ENIs secundarias si quedara alguna
            ENIS=$(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "NetworkInterfaces[*].NetworkInterfaceId" --output text)

            for eni in $ENIS; do
              echo "Eliminando ENI restante: $eni"
              aws ec2 delete-network-interface --network-interface-id "$eni" || true
            done

          else
            echo "No se encontró VPC activa para el entorno."
          fi

      - name: Purge Kubernetes and Helm Resources from State
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          echo "Removiendo módulos de Kubernetes y Helm del tfstate para evitar bloqueos de red..."
          
          # Remover módulos de aplicación e infraestructura K8s del estado
          terraform state rm module.application_deployment || true
          terraform state rm module.application_infrastructure || true

          # Remover cualquier recurso individual de helm o kubernetes si estuvieran en la raíz
          FORGOTTEN_RESOURCES=$(terraform state list | grep -E '^(kubernetes_|helm_)' || true)
          if [ -n "$FORGOTTEN_RESOURCES" ]; then
            for res in $FORGOTTEN_RESOURCES; do
              echo "Removiendo del estado: $res"
              terraform state rm "$res" || true
            done
          fi

      - name: Terraform Destroy
        id: destroy
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          # Execute destruction
          terraform destroy -refresh=false -input=false -auto-approve
          
          echo "✅ Destruction completed"