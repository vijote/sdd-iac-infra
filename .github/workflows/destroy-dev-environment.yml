name: Destroy Dev Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to destroy'
        required: true
        type: choice
        options:
          - dev

permissions:
  id-token: write          # Required for OIDC authentication
  contents: read          # Required for repository checkout
  actions: write          # Required for workflow summaries and artifacts

env:
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.7
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}

  # Application secrets (from repository secrets)
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 600  # 10 hours max
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false
          
      - name: Validate Input
        run: |
          # Validate environment
          if [ "${{ env.ENVIRONMENT }}" != "dev" ]; then
            echo "::error::Only 'dev' environment is supported"
            exit 1
          fi
          
      - name: Terraform Init
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
          
      - name: Create Dummy Kubeconfig for Provider Refresh
        run: |
          mkdir -p ~/.kube
          cat <<EOF > ~/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: dummy-cluster
          contexts:
          - context:
              cluster: dummy-cluster
              user: dummy-user
            name: dummy-context
          current-context: dummy-context
          users:
          - name: dummy-user
            user:
              token: dummy-token
          EOF
          chmod 600 ~/.kube/config

      - name: Auto-Cleanup Orphan Network Interfaces (ENIs)
        run: |
          echo "Buscando VPC del entorno '${{ env.ENVIRONMENT }}'..."
          
          # 1. Obtener la VPC correspondiente
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=*${{ env.ENVIRONMENT }}*" \
            --query "Vpcs[0].VpcId" --output text)

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "VPC identificada: $VPC_ID"

            # 2. Desconectar y eliminar todas las ENIs pertenecientes a esa VPC
            ENIS=$(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "NetworkInterfaces[*].NetworkInterfaceId" --output text)

            for eni in $ENIS; do
              echo "Procesando ENI: $eni"
              
              # Obtener attachment si existe
              ATTACHMENT=$(aws ec2 describe-network-interfaces \
                --network-interface-ids "$eni" \
                --query "NetworkInterfaces[0].Attachment.AttachmentId" --output text)

              if [ -n "$ATTACHMENT" ] && [ "$ATTACHMENT" != "None" ]; then
                echo "Desconectando attachment $ATTACHMENT..."
                aws ec2 detach-network-interface --attachment-id "$ATTACHMENT" --force || true
                sleep 3
              fi

              echo "Eliminando ENI $eni..."
              aws ec2 delete-network-interface --network-interface-id "$eni" || true
            done
          else
            echo "No se encontró VPC activa para el entorno."
          fi

      - name: Terraform Destroy
        id: destroy
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          # Execute destruction
          terraform destroy -refresh=false -input=false -auto-approve
          
          echo "✅ Destruction completed"