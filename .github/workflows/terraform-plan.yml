name: "Terraform Plan"

on:
  pull_request:
    branches: [main, develop]
    paths: ["src/terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write          # Required for OIDC
  contents: read          # Required for checkout
  pull-requests: write    # Required for PR comments
  actions: read           # Required for workflow status

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: us-east-1
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Assume target
      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Init
        id: init
        run: terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}
        continue-on-error: true

      - name: Convert Plan to JSON
        id: plan-json
        run: |
          terraform show -json tfplan > plan.json
          echo "plan_json<<EOF" >> $GITHUB_OUTPUT
          cat plan.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Plan Summary
        id: plan-summary
        run: |
          if [ -f plan.json ]; then
            ADDITIONS=$(jq '.resource_changes[] | select(.change.actions[] == "create") | .change.before == null' plan.json | wc -l)
            CHANGES=$(jq '.resource_changes[] | select(.change.actions[] == "update") | .change.before != null and .change.after != null' plan.json | wc -l)
            DELETIONS=$(jq '.resource_changes[] | select(.change.actions[] == "delete") | .change.after == null' plan.json | wc -l)
            
            echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
            echo "changes=$CHANGES" >> $GITHUB_OUTPUT
            echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          fi
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Terraform Plan Results')
            );
            
            const planOutput = `
            ## Terraform Plan Results
            
            **Environment**: ${{ env.ENVIRONMENT }}
            **Status**: ${{ steps.plan.outcome }}
            
            ### Changes Summary
            - **Additions**: ${{ steps.plan-summary.outputs.additions || 0 }}
            - **Changes**: ${{ steps.plan-summary.outputs.changes || 0 }}
            - **Deletions**: ${{ steps.plan-summary.outputs.deletions || 0 }}
            
            ### Validation Results
            - **Format Check**: ${{ steps.fmt.outcome }}
            - **Init**: ${{ steps.init.outcome }}
            - **Validate**: ${{ steps.validate.outcome }}
            
            <details>
            <summary>📋 Plan Output</summary>
            
            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: planOutput
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: planOutput
              });
            }

      - name: Upload Plan File
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: src/terraform/environments/${{ env.ENVIRONMENT }}/tfplan
          retention-days: 30

      - name: Upload Plan JSON
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-json-${{ env.ENVIRONMENT }}
          path: src/terraform/environments/${{ env.ENVIRONMENT }}/plan.json
          retention-days: 30