name: "Terraform Apply"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write          # Required for OIDC
  contents: read          # Required for checkout

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: us-east-1
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}

  # Vars for phase 1: base infrastructure
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  # ==========================================
  # ETAPA 1: Provisionar Infraestructura Base (AWS EC2 + Kubeadm)
  # ==========================================
  apply-base-infra:
    name: "Phase 1: Base Infrastructure (VPC & EC2)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Apply Base Infrastructure
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.networking \
            -target=module.kubernetes
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

  # ==========================================
  # ETAPA 2: Extraer Kubeconfig y Aplicar Componentes de K8s (Spec 005)
  # ==========================================
  apply-k8s-resources:
    name: "Phase 2: K8s Infrastructure & Apps"
    needs: apply-base-infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Fetch Kubeconfig from Control Plane EC2
        run: |
          mkdir -p ~/.kube

          # 1. Inicializar Terraform en el directorio para poder consultar los outputs del estado en S3
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"

          # 2. Extraer la clave privada SSH generada por Terraform
          terraform output -raw ec2_ssh_private_key > ~/.kube/ssh_key.pem
          chmod 600 ~/.kube/ssh_key.pem

          # 3. Obtener la IP Pública del Control Plane mediante AWS CLI
          CONTROL_PLANE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*control-plane*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Control Plane IP: $CONTROL_PLANE_IP"

          # Obtener la IP privada interna de la instancia EC2
          PRIVATE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*control-plane*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          # 4. Bucle de espera en el runner mientras la EC2 termina de ejecutar cloud-init
          MAX_RETRIES=30
          COUNT=0

          until scp -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.kube/ssh_key.pem ubuntu@$CONTROL_PLANE_IP:/home/ubuntu/.kube/config ~/.kube/config 2>/dev/null; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Tiempo de espera agotado (5m). Kubeadm no creó el archivo en la EC2."
              rm -f ~/.kube/ssh_key.pem
              exit 1
            fi
            echo "Esperando a que cloud-init termine dentro de la EC2 (Intento $COUNT/$MAX_RETRIES)..."
            sleep 10
          done

          echo "¡Kubeconfig obtenido con éxito!"

          echo "Reemplazando IPs internas ($PRIVATE_IP y 127.0.0.1) por IP pública ($CONTROL_PLANE_IP)..."

          # Reemplazar tanto la IP privada interna como localhost por la IP pública
          sed -i "s/$PRIVATE_IP/$CONTROL_PLANE_IP/g" ~/.kube/config
          sed -i "s/127.0.0.1/$CONTROL_PLANE_IP/g" ~/.kube/config

          chmod 600 ~/.kube/config
          rm -f ~/.kube/ssh_key.pem

      - name: Verify Cluster Connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Apply Remaining Workloads
        run: terraform apply -input=false -auto-approve
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Deploy Kubernetes Manifests & Wait for Readiness
        run: |
          # 1. Asegurar que estamos en el directorio donde se ejecutó Terraform
          cd src/terraform/environments/dev

          # 2. Exportar variables dinámicamente desde el estado de Terraform
          eval $(terraform output -json app_config | jq -r 'to_entries[] | "export " + .key + "=\( .value | @sh )"')

          export environment="${{ env.ENVIRONMENT }}"
          export mysql_database="demo_app"
          export mysql_user="demo_user"

          # 3. Construir la lista de variables automáticamente
          TF_VARS=$(terraform output -json app_config | jq -r 'keys | map("$" + .) | join(":")')
          VARS="\$environment:\$mysql_database:\$mysql_user:${TF_VARS}"

          # 4. Ir a la carpeta de los manifiestos YAML
          cd ../../modules/application-deployment/kubernetes

          # 5. Aplicar manifiestos
          for f in $(find . -type f -name "*.yaml"); do
            echo "Aplicando manifiesto: $f"
            envsubst "$VARS" < "$f" | kubectl apply -f -
          done

          # 6. Verificación activa
          kubectl rollout status deployment/mysql -n demo-apps --timeout=180s
          kubectl rollout status deployment/backend -n demo-apps --timeout=180s
          kubectl rollout status deployment/frontend -n demo-apps --timeout=180s