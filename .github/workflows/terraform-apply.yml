name: "Terraform Apply"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write          # Required for OIDC
  contents: read          # Required for checkout

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: us-east-1
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
  # Kubeadm-specific variables
  TF_VAR_kubeconfig_path: ${{ vars.TF_VAR_kubeconfig_path || '~/.kube/config' }}

jobs:
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          # Create kubeconfig directory
          mkdir -p ~/.kube
          
          # If kubeconfig content is provided as a secret, write it
          if [ -n "${{ secrets.KUBECONFIG_CONTENT }}" ]; then
            echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config
          fi
          
          # Set proper permissions
          chmod 600 ~/.kube/config
          
          # Verify kubectl can connect to cluster
          kubectl cluster-info

      - name: Terraform Init
        id: init
        run: terraform init -input=false -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}"
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}


      - name: Terraform Apply
        id: apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: src/terraform/environments/${{ env.ENVIRONMENT }}