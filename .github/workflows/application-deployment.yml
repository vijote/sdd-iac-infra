name: Application Deployment

on:
  push:
    branches: [main]  # Auto-deploy to dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      force_deploy:
        description: 'Force deployment even if health checks fail'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write          # Required for OIDC
  contents: read          # Required for checkout
  pull-requests: write    # Required for PR comments (if needed)
  actions: read           # Required for workflow status

env:
  # Core Configuration (from repository)
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: us-east-1
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
  
  # Application secrets (from repository secrets)
  TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  
  # Pipeline-Specific
  DEPLOYMENT_ID: deploy-${{ github.run_number }}-${{ github.sha }}
  COMMIT_SHA: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}

jobs:
  deploy:
    name: Deploy Applications
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    outputs:
      deployment_id: ${{ env.DEPLOYMENT_ID }}
      status: ${{ job.status }}
      terraform_apply: ${{ steps.apply.outcome }}
      app_deploy: ${{ steps.deploy.outcome }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Apply Terraform - Infrastructure
        id: apply-infra
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -input=false -auto-approve -target=module.kubernetes
      
      - name: Generate kubeconfig
        run: |
          # Wait for cluster to be ready
          echo "Waiting for Kubernetes cluster to be ready..."
          sleep 30
          
          # Get the control plane IP from Terraform outputs
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          CONTROL_PLANE_IP=$(terraform output -raw control_plane_public_ip 2>/dev/null || echo "")
          
          if [ -n "$CONTROL_PLANE_IP" ]; then
            # Generate a basic kubeconfig that can be used with kubectl
            mkdir -p ~/.kube
            cat > ~/.kube/config << EOF
            apiVersion: v1
            kind: Config
            clusters:
            - name: sdd-k8s-${{ env.ENVIRONMENT }}
              cluster:
                server: https://$CONTROL_PLANE_IP:6443
                insecure-skip-tls-verify: true
            contexts:
            - name: sdd-k8s-${{ env.ENVIRONMENT }}
              context:
                cluster: sdd-k8s-${{ env.ENVIRONMENT }}
                user: admin
            current-context: sdd-k8s-${{ env.ENVIRONMENT }}
            users:
            - name: admin
              user:
                insecure-skip-tls-verify: true
            EOF
            echo "Kubeconfig generated for cluster at https://$CONTROL_PLANE_IP:6443"
          else
            echo "Control plane IP not found, creating empty kubeconfig"
            mkdir -p ~/.kube
            touch ~/.kube/config
          fi
      
      - name: Initialize Terraform
        id: init
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false \
            -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
            -backend-config="key=application-deployment/${{ env.ENVIRONMENT }}/terraform.tfstate"
      
      - name: Generate terraform.tfvars
        id: generate-tfvars
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          # Generate terraform.tfvars with repository variables and secrets
          cat > terraform.tfvars << EOF
          # AWS Configuration
          aws_account_id = "${{ env.TF_VAR_aws_account_id }}"
          aws_terraform_role_name = "${{ env.TF_VAR_aws_terraform_role_name }}"
          aws_state_bucket_name = "${{ env.TF_VAR_aws_state_bucket_name }}"
          
          # MySQL Configuration
          mysql_root_password = "${{ env.TF_VAR_mysql_root_password }}"
          mysql_database = "${{ case(env.ENVIRONMENT, 'prod', 'demo_app', 'demo_app_dev') }}"
          mysql_user = "demo_user"
          mysql_password = "${{ env.TF_VAR_mysql_password }}"
          mysql_storage_size = "${{ case(env.ENVIRONMENT, 'prod', '50Gi', '20Gi') }}"
          mysql_storage_class = "${{ case(env.ENVIRONMENT, 'prod', 'gp3', 'gp2') }}"
          
          # Container Images
          frontend_image = "${{ case(env.ENVIRONMENT, 'prod', 'nginx:1.24-alpine', 'nginx:alpine') }}"
          backend_image = "${{ case(env.ENVIRONMENT, 'prod', 'node:18.17-alpine', 'node:18-alpine') }}"
          mysql_image = "${{ case(env.ENVIRONMENT, 'prod', 'mysql:8.0.33', 'mysql:8.0') }}"
          
          # Replicas
          frontend_replicas = ${{ case(env.ENVIRONMENT, 'prod', 2, 1) }}
          backend_replicas = ${{ case(env.ENVIRONMENT, 'prod', 2, 1) }}
          mysql_replicas = 1
          
          # Resource Limits
          frontend_cpu_limit = "${{ case(env.ENVIRONMENT, 'prod', '200m', '100m') }}"
          frontend_memory_limit = "${{ case(env.ENVIRONMENT, 'prod', '256Mi', '128Mi') }}"
          backend_cpu_limit = "${{ case(env.ENVIRONMENT, 'prod', '400m', '200m') }}"
          backend_memory_limit = "${{ case(env.ENVIRONMENT, 'prod', '512Mi', '256Mi') }}"
          mysql_cpu_limit = "${{ case(env.ENVIRONMENT, 'prod', '500m', '300m') }}"
          mysql_memory_limit = "${{ case(env.ENVIRONMENT, 'prod', '1Gi', '512Mi') }}"
          
          # JWT Secret
          jwt_secret = "${{ env.TF_VAR_jwt_secret }}"
          EOF
      
      - name: Plan Terraform
        id: plan
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform plan -input=false \
            -var-file=terraform.tfvars \
            -out=tfplan
      
      - name: Apply Terraform - Applications
        id: apply
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -input=false -auto-approve tfplan
      
      - name: Deploy Applications
        id: deploy
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
            
          # Apply application deployment
          terraform apply -input=false -auto-approve -target=module.application_deployment
      
      - name: Rollback on Failure
        if: failure()
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          echo "Rolling back application deployment..."
          terraform destroy -input=false -auto-approve -target=module.application_deployment
      
      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment ${{ env.DEPLOYMENT_ID }} to ${{ env.ENVIRONMENT }} completed successfully"
            echo "Applications deployed:"
            echo "- Frontend (nginx)"
            echo "- Backend (NodeJS)"
            echo "- Database (MySQL)"
            echo ""
            echo "To check deployment status:"
            echo "kubectl get pods -n demo-apps"
            echo "kubectl get services -n demo-apps"
          else
            echo "Deployment ${{ env.DEPLOYMENT_ID }} to ${{ env.ENVIRONMENT }} failed"
            echo "Check the logs for details"
          fi