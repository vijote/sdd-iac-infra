name: Application Deployment

on:
  push:
    branches: [main]  # Auto-deploy to dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      force_deploy:
        description: 'Force deployment even if health checks fail'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write          # Required for OIDC
  contents: read          # Required for checkout
  pull-requests: write    # Required for PR comments (if needed)
  actions: read           # Required for workflow status

env:
  # Core Configuration (from repository)
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: us-east-1
  AWS_BOOTSTRAP_ROLE: ${{ vars.AWS_BOOTSTRAP_ROLE }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  STATE_BUCKET_NAME: ${{ vars.STATE_BUCKET_NAME }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_aws_terraform_role_name: ${{ vars.AWS_TERRAFORM_ROLE_NAME }}
  TF_VAR_aws_state_bucket_name: ${{ vars.STATE_BUCKET_NAME }}
  
  # Pipeline-Specific
  DEPLOYMENT_ID: deploy-${{ github.run_number }}-${{ github.sha }}
  COMMIT_SHA: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}

jobs:
  deploy:
    name: Deploy Applications
    runs-on: ubuntu-latest
    environment: ${{ env.ENVIRONMENT }}
    
    outputs:
      deployment_id: ${{ env.DEPLOYMENT_ID }}
      status: ${{ job.status }}
      terraform_apply: ${{ steps.apply.outcome }}
      app_deploy: ${{ steps.deploy.outcome }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '>=1.24'
      
      - name: Initialize Terraform
        id: init
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false \
            -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
            -backend-config="key=application-deployment/${{ env.ENVIRONMENT }}/terraform.tfstate"
      
      - name: Plan Terraform
        id: plan
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform plan -input=false \
            -var="aws_account_id=${{ env.TF_VAR_aws_account_id }}" \
            -var="aws_terraform_role_name=${{ env.TF_VAR_aws_terraform_role_name }}" \
            -var="aws_state_bucket_name=${{ env.TF_VAR_aws_state_bucket_name }}" \
            -var-file=${{ env.ENVIRONMENT }}.tfvars \
            -out=tfplan
      
      - name: Apply Terraform
        id: apply
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -input=false -auto-approve tfplan
      
      - name: Generate kubeconfig
        id: kubeconfig
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          # Get cluster outputs
          CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint 2>/dev/null || echo "")
          CONTROL_PLANE_IP=$(terraform output -raw control_plane_public_ip 2>/dev/null || echo "")
          
          if [ -n "$CONTROL_PLANE_IP" ]; then
            CLUSTER_ENDPOINT="https://$CONTROL_PLANE_IP:6443"
          fi
          
          if [ -n "$CLUSTER_ENDPOINT" ]; then
            # Generate a basic kubeconfig for the cluster
            mkdir -p ~/.kube
            cat > ~/.kube/config << EOF
apiVersion: v1
kind: Config
clusters:
- name: sdd-k8s-${{ env.ENVIRONMENT }}
  cluster:
    server: $CLUSTER_ENDPOINT
    insecure-skip-tls-verify: true
contexts:
- name: sdd-k8s-${{ env.ENVIRONMENT }}
  context:
    cluster: sdd-k8s-${{ env.ENVIRONMENT }}
    user: sdd-k8s-${{ env.ENVIRONMENT }}-admin
current-context: sdd-k8s-${{ env.ENVIRONMENT }}
users:
- name: sdd-k8s-${{ env.ENVIRONMENT }}-admin
  user:
    auth-provider:
      name: aws
      config:
        clusterID: sdd-k8s-${{ env.ENVIRONMENT }}
          EOF
          echo "Kubeconfig generated for cluster: $CLUSTER_ENDPOINT"
          else
            echo "No cluster endpoint found, skipping kubeconfig generation"
          fi
      
      - name: Deploy Applications
        id: deploy
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          
          # Apply application deployment
          terraform apply -input=false -auto-approve -target=module.application_deployment
      
      - name: Rollback on Failure
        if: failure()
        run: |
          cd src/terraform/environments/${{ env.ENVIRONMENT }}
          echo "Rolling back application deployment..."
          terraform destroy -input=false -auto-approve -target=module.application_deployment
      
      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment ${{ env.DEPLOYMENT_ID }} to ${{ env.ENVIRONMENT }} completed successfully"
            echo "Applications deployed:"
            echo "- Frontend (nginx)"
            echo "- Backend (NodeJS)"
            echo "- Database (MySQL)"
            echo ""
            echo "To check deployment status:"
            echo "kubectl get pods -n demo-apps"
            echo "kubectl get services -n demo-apps"
          else
            echo "Deployment ${{ env.DEPLOYMENT_ID }} to ${{ env.ENVIRONMENT }} failed"
            echo "Check the logs for details"
          fi