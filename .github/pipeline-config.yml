# Pipeline Configuration

pipeline:
  name: "Application Deployment"
  version: "1.0"
  timeout_minutes: 30
  
stages:
  - name: "validate"
    timeout: 5
    description: "Validate configuration and prerequisites"
    
  - name: "deploy_infrastructure"
    timeout: 10
    description: "Deploy infrastructure using Terraform"
    
  - name: "deploy_applications"
    timeout: 10
    description: "Deploy applications to Kubernetes"
    
  - name: "validate_deployment"
    timeout: 5
    description: "Validate deployment health and connectivity"
  
applications:
  - name: "mysql"
    type: "database"
    order: 1
    health_check:
      endpoint: "/health"
      timeout: 60
      retries: 3
      
  - name: "backend"
    type: "api"
    order: 2
    health_check:
      endpoint: "/api/health"
      timeout: 30
      retries: 3
      
  - name: "frontend"
    type: "web"
    order: 3
    health_check:
      endpoint: "/health"
      timeout: 30
      retries: 3

# Deployment configuration
deployment:
  strategy: "rolling_update"
  order: ["mysql", "backend", "frontend"]
  
  rollback:
    enabled: true
    automatic: true
    timeout: 180
    max_retries: 3
    
  health_checks:
    enabled: true
    timeout: 120
    interval: 10
    failure_threshold: 3

# Environment-specific overrides
environments:
  dev:
    auto_deploy: true
    require_approval: false
    timeout_minutes: 20
    
  prod:
    auto_deploy: false
    require_approval: true
    approvers: ["admin-team"]
    timeout_minutes: 45

# Notification settings
notifications:
  enabled: true
  channels:
    - type: "slack"
      webhook: "${{ secrets.NOTIFICATION_WEBHOOK }}"
      on_success: true
      on_failure: true
      
    - type: "email"
      recipients: ["devops@example.com"]
      on_failure: true

# Security settings
security:
  oidc:
    enabled: true
    provider: "github"
    
  secrets:
    source: "github_secrets"
    encryption: "at_rest"
    
  network_policies:
    enabled: true
    default_deny: false

# Monitoring and observability
monitoring:
  enabled: true
  metrics:
    enabled: true
    port: 9090
    
  logging:
    level: "info"
    format: "json"
    
  tracing:
    enabled: false
    sample_rate: 0.1

# Resource limits
resources:
  default:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
      
  maximum:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# Compliance and audit
audit:
  enabled: true
  log_all_actions: true
  retention_days: 90
  
  events:
    - "deployment_start"
    - "deployment_success"
    - "deployment_failure"
    - "rollback_start"
    - "rollback_success"
    - "rollback_failure"

# Integration settings
integrations:
  terraform:
    version: ">=1.5"
    backend: "s3"
    state_file: "terraform.tfstate"
    
  kubernetes:
    version: ">=1.24"
    namespace: "demo-apps"
    
  aws:
    region: "us-east-1"
    assume_role: true